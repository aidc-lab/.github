name: Feature request
description: Suggest a capability, an improvement or a new project.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. Describe the problem first — it is much easier to evaluate a solution when we understand the workflow behind it.
  - type: input
    id: project
    attributes:
      label: Repository or project
      description: Which repository should this land in? Say "new project" if it does not exist yet.
      placeholder: lumen
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Sketch of the behaviour or interface you would like. Mockups welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have already tried.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and discussions for this idea.
          required: true
